pid logs/nginx.pid;
error_log /dev/stderr notice;
events {}

http {
    access_log off;
    client_body_temp_path logs/tmp;
    proxy_temp_path logs/tmp;

    proxy_cache_path logs/cache keys_zone=c:1m;

    server {
        listen 1337;
        large_client_header_buffers 4 16k;
        location / {
            # header value with 200 chars in size
            add_header X-Pad xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx always;
            return 200 "hello brother! this is nginx.\n";
        }
    }

    # Caching proxy (default proxy_buffer_size: one page, 4k).
    server {
        listen 1338;
        location / {
            proxy_cache c;
            proxy_pass http://127.0.0.1:1337;
        }
    }
}
