services:
  nginx:
    image: nginx:${NGINX_VERSION:-1.31.8}
    working_dir: /repro/logs
    command: [nginx, -p, /repro, -c, nginx.conf, -g, "daemon off;"]
    volumes:
      - ./nginx.conf:/repro/nginx.conf:ro
    tmpfs:
      - /repro
    ports:
      - 127.0.0.1:1337:1337
      - 127.0.0.1:1338:1338
